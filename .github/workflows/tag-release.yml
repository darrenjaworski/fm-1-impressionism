# fm-1-impressionism: after test.yml passes on main, compute the next SemVer tag from Conventional Commits
# since the last release (tools/next_version.py) and push it if there's a real bump (fix:/feat:/breaking --
# docs/chore/ci/etc. alone release nothing). Deliberately runs AFTER test.yml, not in parallel with it: a tag
# (and the release it leads to) should only ever land on a commit that's already passed the full suite.
#
# Pushing the tag with the default GITHUB_TOKEN does NOT itself trigger release.yml's `push: tags` -- GitHub
# doesn't chain workflow runs from a GITHUB_TOKEN-authored event, a deliberate anti-recursion safeguard, not a
# bug to route around. So this explicitly dispatches release.yml at the new tag instead; running workflow_dispatch
# against a tag ref makes release.yml's own `github.ref_type == 'tag'` gates (the release/attestation steps)
# fire exactly as they would from a real tag push.
name: tag release

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create and push the tag
      actions: write # to dispatch release.yml at it
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # tools/next_version.py needs the full tag/commit history, not a shallow clone

      - name: git identity (for the annotated tag)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute and push the next version tag
        id: version
        run: |
          out="$(python3 tools/next_version.py)"
          echo "$out"
          tag="$(echo "$out" | sed -n 's/^TAGGED=//p')" # the one unambiguous line; see tools/next_version.py
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch release.yml at the new tag
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}"
