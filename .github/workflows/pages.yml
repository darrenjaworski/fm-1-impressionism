# fm-1-impressionism: deploy site/ to GitHub Pages (repo setting: build from GitHub Actions, not a branch).
# Step 1 (this file): a hello-world static page, to prove the deploy pipeline itself works end to end before
# anything emulator-related gets vendored in (ROADMAP.md's "an online playable version"). The actual emulator
# site replaces site/'s content later; this workflow's shape (configure-pages/upload-pages-artifact/deploy-pages)
# shouldn't need to change when that happens.
#
# Triggers: a direct change to this page's own files (site/**, or this workflow); and a published release
# (release.yml), so the emulator's copy of the firmware stays on the latest build once that part exists --
# ROADMAP.md's plan fetches it from "the latest release" at build time, so a new release is a real reason to
# redeploy even when nothing in site/ itself changed.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
