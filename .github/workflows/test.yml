# fm-1-impressionism: build every board variant and run the full test suite (tests/run_tests.sh) on every push
# to a branch and every pull request -- the same build + test steps as release.yml's non-release path, kept as a
# separate file rather than refactored into a shared reusable workflow (release.yml is forked-as-is from Dinghy
# upstream; duplicating a dozen lines here is a smaller risk than editing that proven file). If the two drift
# apart enough to be a nuisance, that's the point where this is worth turning into a workflow_call.
#
# The real toolchain matters: tests/run_tests.sh needs a completed build (it exits early otherwise), and a real
# build is what caught the engine_rng/libc.c naming collision host-mode testing couldn't (see git history) --
# so this runs on every push/PR, not just a lighter host-only subset.
name: test

on:
  push:
    branches: ["**"] # not tags: release.yml already builds+tests those on a vX.Y tag
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (the SMK-37 first, the FM-1 last, as the tests expect)
        run: |
          BOARD=smk37 sh build.sh
          BOARD=smk37 MODEL=elite sh build.sh
          BOARD=smk37 MODEL=mke sh build.sh
          sh build.sh

      - name: Run the full test suite (tests/run_tests.sh)
        run: sh tests/run_tests.sh
